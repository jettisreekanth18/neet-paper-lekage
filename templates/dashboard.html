<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #182848;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .logout {
            background-color: #e74c3c;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: white;
            padding: 25px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h2 {
            font-size: 35px;
            margin: 10px;
            color: #182848;
        }

        .menu {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .menu a {
            background-color: #182848;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 7px;
        }

        .menu a:hover {
            background-color: #263d68;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>NEET Paper Security System</h1>
        <a href="/logout" class="logout">Logout</a>
    </div>

    <div class="container">

        <h2>Welcome, {{ session["username"] }}!</h2>

        <h2>Admin Dashboard</h2>

        <div class="cards">

            <div class="card">
                <h3>Users</h3>
                <h2>1</h2>
            </div>

            <div class="card">
                <h3>Question Papers</h3>
                <h2>0</h2>
            </div>

            <div class="card">
                <h3>Security Alerts</h3>
                <h2>0</h2>
            </div>

            <div class="card">
                <h3>Complaints</h3>
                <h2>0</h2>
            </div>

        </div>

        <h2>Admin Menu</h2>

        <div class="menu">

            <a href="/papers">Manage Papers</a>

            <a href="/access-logs">Access Logs</a>

            <a href="#">Security Alerts</a>

            <a href="#">Complaints</a>

            <a href="/logout">Logout</a>

        </div>

    </div>

</body>
</html>
